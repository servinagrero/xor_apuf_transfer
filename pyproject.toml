[project]
name = "puf-transfer"
version = "0.1.0"
description = "Study on correlation and transferability in XOR Arbiter PUFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pypuf>=2.2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "ruff>=0.17.1",
    "ty>=0.0.88",
    "zensical>=0.0.66",
]
